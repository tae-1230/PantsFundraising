<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f3f3;
            color: #333;
        }

        header {
            background: #2b57ff;
            color: white;
            padding: 12px 20px;
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo a {
            color: #fff;
            text-decoration: none;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 16px;
            font-size: 0.95rem;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        .progress-bar {
            background: #ddd;
            width: 100%;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: #4caf50;
            width: 0%; /* JS will set this dynamically */
            height: 100%;
            transition: width 0.4s ease;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2b57ff;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d3bd1;
        }

        /* Login styles */
        .auth-container {
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .hidden {
            display: none;
        }

        .small-text {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo"><a href="home.html">Branham High School Fundraiser </a></div>
        <nav>
            <a href="home.html">Search</a>
            <a href="admin.html">Admin</a>
        </nav>
    </div>
</header>

<!-- SIGN IN PAGE -->
<div id="login-page" class="container auth-container">
    <h2>Sign In</h2>
    <p class="small-text">Sign in to access this fundraiser.</p>
    <form id="login-form">
        <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required>
        </div>
        <button type="submit">Sign In</button>
    </form>
</div>

<!-- FUNDRAISER PAGE -->
<div id="fundraiser-page" class="container hidden"
     data-goal="1000" data-start-raised="400">
    <h2 id="fundraiser-title">About the Cause</h2>
    <p id="fundraiser-description">
        We are raising funds to support skibidi.
        Every donation helps and is greatly appreciated!
    </p>

    <h3>Goal Progress</h3>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
    <p>
        <strong><span id="raised-amount">$0</span></strong>
        raised of
        <strong><span id="goal-amount">$0</span></strong> goal
        (<span id="percent-funded">0%</span> funded)
    </p>

    <br>

    <button id="donate-btn">Donate Now</button>
    <a href="home.html" style="color:#2b57ff; font-weight:bold;">← Back to All Fundraisers</a>
</div>

<script>

    if (!sessionStorage.getItem('sessionInitialized')) {
    // Clear all donations
    localStorage.removeItem('fh_donations');

    // Optional: also reset fundraiser goals to defaults
    // localStorage.removeItem('fh_fundraisers');

    // Mark session as initialized so it won't run again this session
    sessionStorage.setItem('sessionInitialized', 'true');
}
    //shared storage keys
    const STORAGE_KEYS = {
        FUNDRAISERS: 'fh_fundraisers',  // for edited goals
        DONATIONS: 'fh_donations'       // for recorded donations
    };
    let currentUser = null;
    const USER_STORE = window.sessionStorage;

    // default stats and info
    const DEFAULT_FUNDRAISERS = [
        {
            id: 'skibidi',
            title: 'Support Skibidi Fundraiser',
            description: 'We are raising funds to support skibidi. Every donation helps and is greatly appreciated!',
            goal: 1000,
            startRaised: 400
        },
        {
            id: 'robotics-trip',
            title: 'Robotics Club Nationals Trip',
            description: 'Our high school robotics team qualified for nationals and needs help covering travel and lodging.',
            goal: 5000,
            startRaised: 1250
        },
        {
            id: 'animal-shelter',
            title: 'Local Animal Shelter Renovation',
            description: 'We are renovating our local shelter to add more space, better medical facilities, and outdoor play areas.',
            goal: 8000,
            startRaised: 2300
        }
    ];

    function loadFundraisers() {
        // Use any goals saved by admin, fall back to defaults
        try {
            const stored = JSON.parse(localStorage.getItem(STORAGE_KEYS.FUNDRAISERS) || 'null');
            if (!Array.isArray(stored) || stored.length === 0) return DEFAULT_FUNDRAISERS.slice();

            // merge by id (keep default startRaised unless overridden)
            const merged = DEFAULT_FUNDRAISERS.map(def => {
                const match = stored.find(s => s.id === def.id);
                return match ? { ...def, ...match } : def;
            });
            return merged;
        } catch (e) {
            return DEFAULT_FUNDRAISERS.slice();
        }
    }

    function loadDonations() {
        try {
            const stored = JSON.parse(localStorage.getItem(STORAGE_KEYS.DONATIONS) || '[]');
            return Array.isArray(stored) ? stored : [];
        } catch (e) {
            return [];
        }
    }

    function formatMoney(value) {
        return '$' + value.toLocaleString(undefined, {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        // dom elements
        const loginPage = document.getElementById('login-page');
        const fundraiserPage = document.getElementById('fundraiser-page');
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        loginPage.classList.remove('hidden');
        fundraiserPage.classList.add('hidden');

        const progressFill = document.getElementById('progress-fill');
        const raisedAmountEl = document.getElementById('raised-amount');
        const goalAmountEl = document.getElementById('goal-amount');
        const percentFundedEl = document.getElementById('percent-funded');
        const donateBtn = document.getElementById('donate-btn');
        const titleEl = document.getElementById('fundraiser-title');
        const descEl = document.getElementById('fundraiser-description');

        // reloading data
        const fundraisers = loadFundraisers();
        const donations = loadDonations();

        // fundraiser based on parameters
        const params = new URLSearchParams(window.location.search);
        const fundraiserId = params.get('id') || 'skibidi';
        const current = fundraisers.find(f => f.id === fundraiserId) || fundraisers[0];

        // text
        titleEl.textContent = current.title;
        descEl.textContent = current.description;

        // goal and raised
        let goal = Number(current.goal) || 0;
        const baseRaised = Number(current.startRaised) || 0;
        let raised = baseRaised + donations
            .filter(d => d.fundraiserId === current.id)
            .reduce((sum, d) => sum + (Number(d.amount) || 0), 0);

        function updateProgressBar() {
            const percent = goal > 0 ? Math.min((raised / goal) * 100, 100) : 0;
            progressFill.style.width = percent + '%';
            raisedAmountEl.textContent = formatMoney(raised);
            goalAmountEl.textContent = formatMoney(goal);
            percentFundedEl.textContent = percent.toFixed(1) + '%';
        }

        // When user logs in, show fundraiser page
        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            // NEW: create a brand-new user object every login
            currentUser = {
                id: 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2),
                email: email
            };
            // (We DON'T save this to localStorage — it's only in memory)

            loginPage.classList.add('hidden');
            fundraiserPage.classList.remove('hidden');

            updateProgressBar();
});


        donateBtn.addEventListener('click', function () {
            const input = prompt('How much would you like to donate? (USD)');
            if (input === null) {
                return; // user cancelled
            }

            const amount = parseFloat(input);

            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid donation amount greater than 0.');
                return;
            }

            raised += amount;

            // save the donation into the progress and home page
            const email = currentUser && currentUser.email ? currentUser.email : 'anonymous';
            const userId = currentUser && currentUser.id ? currentUser.id : null;

            let donations = JSON.parse(localStorage.getItem(STORAGE_KEYS.DONATIONS) || '[]');
            donations.push({
                email: email,
                userId: userId,          // optional, but shows each login is unique
                fundraiserId: current.id,
                amount: amount,
                time: new Date().toISOString()
            });
            localStorage.setItem(STORAGE_KEYS.DONATIONS, JSON.stringify(donations));

            updateProgressBar();
            alert('Thank you for your donation of ' + formatMoney(amount) + '!');
        });
    });
</script>


</body>
</html>
