<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f3f3;
            color: #333;
        }

        header {
            background: #2b57ff;
            color: white;
            padding: 12px 20px;
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo a {
            color: #fff;
            text-decoration: none;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 16px;
            font-size: 0.95rem;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        .progress-bar {
            background: #ddd;
            width: 100%;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: #4caf50;
            width: 0%; /* JS will set this dynamically */
            height: 100%;
            transition: width 0.4s ease;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2b57ff;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d3bd1;
        }

        /* Login styles */
        .auth-container {
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .hidden {
            display: none;
        }

        .small-text {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo"><a href="home.html">Fundraiser Hub</a></div>
        <nav>
            <a href="home.html">Search</a>
            <a id="admin" href="admin.html">Admin</a>
        </nav>
    </div>
</header>

<!-- SIGN IN PAGE -->
<div id="login-page" class="container auth-container">
    <h2>Sign In</h2>
    <p class="small-text">Sign in to access this fundraiser.</p>
    <form id="login-form">
        <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required>
        </div>
        <button type="submit">Sign In</button>
    </form>
</div>

<!-- FUNDRAISER PAGE -->
<div id="fundraiser-page" class="container hidden"
     data-goal="1000" data-start-raised="400">
    <h2 id="fundraiser-title">About the Cause</h2>
    <p id="fundraiser-description">
        We are raising funds to support skibidi.
        Every donation helps and is greatly appreciated!
    </p>

    <h3>Goal Progress</h3>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
    <p>
        <strong><span id="raised-amount">$0</span></strong>
        raised of
        <strong><span id="goal-amount">$0</span></strong> goal
        (<span id="percent-funded">0%</span> funded)
    </p>

    <br>

    <button id="donate-btn">Donate Now</button>
</div>

<script>
    // Same data as on home.html
    const fundraisers = [
        {
            id: 'skibidi',
            title: 'Support Skibidi Fundraiser',
            tagline: 'Help us support skibidi.',
            description: 'We are raising funds to support skibidi. Every donation helps and is greatly appreciated!',
            goal: 1000,
            startRaised: 400,
            email: "test@gmail.com"
        },
        {
            id: 'robotics-trip',
            title: 'Robotics Club Nationals Trip',
            tagline: 'Send our robotics team to nationals!',
            description: 'Our high school robotics team qualified for nationals and needs help covering travel and lodging.',
            goal: 5000,
            startRaised: 1250,
            email: "test@gmail.com"
        },
        {
            id: 'animal-shelter',
            title: 'Local Animal Shelter Renovation',
            tagline: 'Give cats and dogs a better home.',
            description: 'We are renovating our local shelter to add more space, better medical facilities, and outdoor play areas.',
            goal: 8000,
            startRaised: 2300,
            email: "test@gmail.com"
        }
    ];

    document.addEventListener('DOMContentLoaded', function () {
        // --- SIGN IN LOGIC (not real authentication) ---
        //Instantiating html elements in Javascript
        const loginPage = document.getElementById('login-page');
        const fundraiserPage = document.getElementById('fundraiser-page');
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
    
        const progressFill = document.getElementById('progress-fill');
        const raisedAmountEl = document.getElementById('raised-amount');
        const goalAmountEl = document.getElementById('goal-amount');
        const percentFundedEl = document.getElementById('percent-funded');
        const donateBtn = document.getElementById('donate-btn');
        const titleEl = document.getElementById('fundraiser-title');
        const descEl = document.getElementById('fundraiser-description');

        // pick fundraiser based on ?id= param
        const params = new URLSearchParams(window.location.search);
        const fundraiserId = params.get('id') || 'skibidi';
        const current = fundraisers.find(f => f.id === fundraiserId) || fundraisers[0];

        // set page content based on chosen fundraiser
        titleEl.textContent = current.title;
        descEl.textContent = current.description;
        fundraiserPage.dataset.goal = current.goal;
        fundraiserPage.dataset.startRaised = current.startRaised;
        admin.classList.add('hidden');
        let goal = parseFloat(fundraiserPage.dataset.goal);
        let raised = parseFloat(fundraiserPage.dataset.startRaised);

        // Formats money by forcing each value to have between 0-2 decimals
        function formatMoney(value) {
            return '$' + value.toLocaleString(undefined, {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        // function to update the progress bar
        function updateProgressBar() {
            const percent = Math.min((raised / goal) * 100, 100); // cap at 100%
            progressFill.style.width = percent + '%'; // Updates progress bar 
            raisedAmountEl.textContent = formatMoney(raised); // Updates raised amount
            goalAmountEl.textContent = formatMoney(goal); // Updates goal amount
            percentFundedEl.textContent = percent.toFixed(1) + '%'; // Updates percent
        }

        // When user logs in, show fundraiser page
        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            // Gets the value of input and password and removes whitespaces
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Checks if a email and pasword are submitted
            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }
            
            //Hides the login page and shows the fundraiser page
            loginPage.classList.add('hidden');
            fundraiserPage.classList.remove('hidden');
            // Code doesn't work but basically just hides admin until a person gets past the login page
            if(current.email != emailInput)
            {
                admin.classList.remove('hidden');
            }
            // initialize values on first show
            updateProgressBar();
        });

        // Button to donate
        donateBtn.addEventListener('click', function () {
            const input = prompt('How much would you like to donate? (USD)');
            if (input === null) {
                return; // user cancelled
            }

            const amount = parseFloat(input);

            // Checks if input is valid if it isnt doesnt proceed to updating progress bar
            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid donation amount greater than 0.');
                return;
            }

            // updates progress bar, amount raised, and percent raised and gives a message to tell the user the donation was successful
            raised += amount;
            updateProgressBar();
            alert('Thank you for your donation of ' + formatMoney(amount) + '!');
        });
    });
</script>

</body>
</html>
