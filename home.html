<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Hub – Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f3f3;
            color: #333;
        }

        header {
            background: #2b57ff;
            color: white;
            padding: 12px 20px;
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 16px;
            font-size: 0.95rem;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .fundraiser-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h3 {
            margin: 0 0 8px;
        }

        .card p {
            margin: 4px 0;
        }

        .tagline {
            font-size: 0.9rem;
            color: #666;
        }

        .goal-text {
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 8px;
        }

        .view-btn {
            margin-top: 12px;
            padding: 10px;
            text-align: center;
            background: #2b57ff;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .view-btn:hover {
            background: #1d3bd1;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo">Fundraiser Hub</div>
        <nav>
            <a href="home.html">Home</a>
            <a href="home.html">Search</a>
            <a href="fundraiser.html">Sample Fundraiser</a>
            <a href="admin.html">Admin</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="search-bar">
        <input id="search-input" type="text" placeholder="Search fundraisers (e.g. trip, shelter, robotics)...">
    </div>

    <div id="fundraiser-list" class="fundraiser-list"></div>
</div>

<script>
    // In a real app you might fetch this from a server.
    // For this static site, we just hard-code some sample fundraisers.
    const fundraisers = [
        {
            id: 'skibidi',
            title: 'Support Skibidi Fundraiser',
            tagline: 'Help us support skibidi.',
            description: 'We are raising funds to support skibidi. Every donation helps and is greatly appreciated!',
            goal: 1000,
            startRaised: 400
        },
        {
            id: 'robotics-trip',
            title: 'Robotics Club Nationals Trip',
            tagline: 'Send our robotics team to nationals!',
            description: 'Our high school robotics team qualified for nationals and needs help covering travel and lodging.',
            goal: 5000,
            startRaised: 1250
        },
        {
            id: 'animal-shelter',
            title: 'Local Animal Shelter Renovation',
            tagline: 'Give cats and dogs a better home.',
            description: 'We are renovating our local shelter to add more space, better medical facilities, and outdoor play areas.',
            goal: 8000,
            startRaised: 2300
        }
    ];

    const listEl = document.getElementById('fundraiser-list');
    const searchInput = document.getElementById('search-input');

    function renderFundraisers(items) {
        listEl.innerHTML = '';

        items.forEach(f => {
            const card = document.createElement('div');
            card.className = 'card';

            const percent = Math.min((f.startRaised / f.goal) * 100, 100);
            const percentText = isFinite(percent) ? percent.toFixed(1) : '0.0';

            card.innerHTML = `
                <div>
                    <h3>${f.title}</h3>
                    <p class="tagline">${f.tagline}</p>
                    <p>${f.description}</p>
                    <p class="goal-text">
                        Goal: $${f.goal.toLocaleString()}
                        &nbsp;•&nbsp; Raised: $${f.startRaised.toLocaleString()}
                        &nbsp;(${percentText}%)
                    </p>
                </div>
                <a class="view-btn" href="fundraiser.html?id=${encodeURIComponent(f.id)}">
                    View &amp; Donate
                </a>
            `;

            listEl.appendChild(card);
        });

        if (items.length === 0) {
            listEl.innerHTML = '<p>No fundraisers found. Try a different search term.</p>';
        }
    }

    // Initial render
    renderFundraisers(fundraisers);

    // Simple search filter
    searchInput.addEventListener('input', () => {
        const term = searchInput.value.toLowerCase().trim();

        const filtered = fundraisers.filter(f => {
            return (
                f.title.toLowerCase().includes(term) ||
                f.description.toLowerCase().includes(term) ||
                f.tagline.toLowerCase().includes(term)
            );
        });

        renderFundraisers(filtered);
    });
</script>

</body>
</html>
