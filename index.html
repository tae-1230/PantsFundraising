<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f3f3;
            color: #333;
        }

        header {
            background: #2b57ff;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        .progress-bar {
            background: #ddd;
            width: 100%;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: #4caf50;
            width: 40%; /* Change this number to update progress */
            height: 100%;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2b57ff;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d3bd1;
        }
    </style>
</head>
<body>

<header>
    Support Our Fundraiser
</header>

<div class="container">
    <h2>About the Cause</h2>
    <p>
        We are raising funds to support [your cause here].
        Every donation helps and is greatly appreciated!
    </p>

    <h3>Goal Progress</h3>
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>
    <p><strong>$400</strong> raised of $1,000 goal</p>

    <br>

    <button>Donate Now</button>
</div>

</body>
</html>
