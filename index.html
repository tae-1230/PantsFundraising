<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraiser Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f3f3;
            color: #333;
        }

        header {
            background: #2b57ff;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        .progress-bar {
            background: #ddd;
            width: 100%;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: #4caf50;
            width: 0%; /* JS will set this dynamically */
            height: 100%;
            transition: width 0.4s ease;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2b57ff;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d3bd1;
        }

        /* Login styles */
        .auth-container {
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .hidden {
            display: none;
        }

        .small-text {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    Support Our Fundraiser
</header>

<!-- SIGN IN PAGE -->
<div id="login-page" class="container auth-container">
    <h2>Sign In</h2>
    <p class="small-text">Sign in to access your fundraiser account.</p>
    <form id="login-form">
        <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required>
        </div>
        <button type="submit">Sign In</button>
    </form>
</div>

<!-- FUNDRAISER PAGE -->
<div id="fundraiser-page" class="container hidden"
     data-goal="1000" data-start-raised="400">
    <h2>About the Cause</h2>
    <p>
        We are raising funds to support [your cause here].
        Every donation helps and is greatly appreciated!
    </p>

    <h3>Goal Progress</h3>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
    <p>
        <strong><span id="raised-amount">$0</span></strong>
        raised of
        <strong><span id="goal-amount">$0</span></strong> goal
        (<span id="percent-funded">0%</span> funded)
    </p>

    <br>

    <button id="donate-btn">Donate Now</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // --- SIGN IN LOGIC (front-end only, not real authentication) ---
        const loginPage = document.getElementById('login-page');
        const fundraiserPage = document.getElementById('fundraiser-page');
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Very simple check – in a real app you'd validate on the server
            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            // "Log in": hide login page, show fundraiser page
            loginPage.classList.add('hidden');
            fundraiserPage.classList.remove('hidden');
        });

        // --- FUNDRAISER / PROGRESS BAR LOGIC ---
        const progressFill = document.getElementById('progress-fill');
        const raisedAmountEl = document.getElementById('raised-amount');
        const goalAmountEl = document.getElementById('goal-amount');
        const percentFundedEl = document.getElementById('percent-funded');
        const donateBtn = document.getElementById('donate-btn');

        const goal = parseFloat(fundraiserPage.dataset.goal);            // e.g. 1000
        let raised = parseFloat(fundraiserPage.dataset.startRaised);    // e.g. 400

        function formatMoney(value) {
            return '$' + value.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function updateProgressBar() {
            const percent = Math.min((raised / goal) * 100, 100); // cap at 100%
            progressFill.style.width = percent + '%';
            raisedAmountEl.textContent = formatMoney(raised);
            goalAmountEl.textContent = formatMoney(goal);
            percentFundedEl.textContent = percent.toFixed(1) + '%';
        }

        // Initialize values on load
        updateProgressBar();

        donateBtn.addEventListener('click', function () {
            const input = prompt('How much would you like to donate? (USD)');
            if (input === null) {
                // user cancelled
                return;
            }

            const amount = parseFloat(input);

            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid donation amount greater than 0.');
                return;
            }

            raised += amount;
            updateProgressBar();
            alert('Thank you for your donation of ' + formatMoney(amount) + '!');
        });
    });
</script>

</body>
</html>
